<html>
  <body style="font-family: Arial, sans-serif; color: #0f172a;">
    <h2>Password reset request</h2>
    <p>Hi {{name}},</p>
    <p>We received a request to reset your password. Click the button below to set a new password.</p>
    <p style="margin: 20px 0;"><a href="{{resetLink}}" style="display:inline-block;padding:12px 18px;background:#0f766e;color:white;border-radius:8px;text-decoration:none;">Reset password</a></p>
    <p>This link will expire in 30 minutes.</p>
    <p>If you didn't request this, you can ignore this email.</p>
    <hr />
    <p style="font-size: 0.9rem; color:#6b7280;">If you didn't request a password reset, ignore this email.</p>
  </body>
</html>
