<html>
  <body style="font-family: Arial, sans-serif; color: #0f172a;">
    <h2>Verify your Hajzy account</h2>
    <p>Hi {{name}},</p>
    <p>Thanks for signing up. Click the button below to verify your email address.</p>
    <p style="margin: 20px 0;"><a href="{{verificationLink}}" style="display:inline-block;padding:12px 18px;background:#0f766e;color:white;border-radius:8px;text-decoration:none;">Verify email</a></p>
    <p>If the button doesn't work, open this link in your browser:</p>
    <p><a href="{{verificationLink}}">{{verificationLink}}</a></p>
    <hr />
    <p style="font-size: 0.9rem; color:#6b7280;">If you didn't create an account, ignore this email.</p>
  </body>
</html>
