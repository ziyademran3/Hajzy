version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hajzy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hajzy
      POSTGRES_USER: hajzy
      POSTGRES_PASSWORD: hajzy_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
