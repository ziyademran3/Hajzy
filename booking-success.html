<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تم تأكيد الحجز</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#f7faf5',
              surface: '#f7faf5',
              'surface-container-lowest': '#ffffff',
              'surface-container-low': '#f1f4ef',
              'surface-container': '#ecefea',
              'surface-container-high': '#e6e9e4',
              'surface-variant': '#e0e3de',
              'on-surface': '#191c1a',
              'on-surface-variant': '#3f4947',
              primary: '#00433f',
              'primary-container': '#0f5c57',
              'on-primary-container': '#8fd2cb',
              'on-primary': '#ffffff',
              secondary: '#7e5700',
              'secondary-container': '#ffc96f',
              outline: '#6f7977',
              'outline-variant': '#bec9c6',
              error: '#ba1a1a'
            },
            spacing: {
              'margin-page': '24px',
              'stack-sm': '8px',
              'stack-md': '16px',
              'stack-lg': '32px'
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen flex flex-col">
    <header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-md shadow-sm flex flex-row-reverse justify-between items-center px-margin-page h-16">
      <a href="index.html" class="w-12 h-12 flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95">
        <span class="material-symbols-outlined">menu</span>
      </a>
      <h1 class="text-xl font-semibold text-primary">المساكن الخاصة</h1>
      <button class="w-12 h-12 flex items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-95">
        <span class="material-symbols-outlined">notifications</span>
      </button>
    </header>

    <main class="flex-1 mt-[72px] mb-[90px] px-margin-page py-stack-lg flex flex-col items-center justify-center">
      <div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] p-stack-lg w-full max-w-md text-center">
        <div class="w-24 h-24 bg-primary-container rounded-full mx-auto flex items-center justify-center mb-5 text-on-primary-container">
          <span class="material-symbols-outlined text-[64px]">check_circle</span>
        </div>
        <h2 class="text-3xl font-bold text-primary mb-2">تم تأكيد الحجز بنجاح</h2>
        <p class="text-sm text-on-surface-variant mb-6">شكراً لاختياركم المساكن الخاصة. نتطلع للترحيب بكم.</p>
        <div class="flex items-center justify-center gap-2 mb-6">
          <span class="text-sm text-on-surface-variant">رقم المرجع:</span>
          <div class="bg-surface-container-low rounded-full px-4 py-2 flex items-center gap-2">
            <span class="text-lg font-bold text-primary">#REF-98765</span>
            <span class="material-symbols-outlined text-sm text-outline">content_copy</span>
          </div>
        </div>

        <div class="bg-surface-container-low rounded-lg p-4 text-right border border-outline-variant">
          <div class="flex justify-between items-center mb-3 border-b border-outline-variant pb-3">
            <span class="text-sm text-on-surface-variant">تاريخ الوصول</span>
            <span class="text-sm text-on-surface">١٥ أكتوبر ٢٠٢٣</span>
          </div>
          <div class="flex justify-between items-center mb-3 border-b border-outline-variant pb-3">
            <span class="text-sm text-on-surface-variant">تاريخ المغادرة</span>
            <span class="text-sm text-on-surface">٢٠ أكتوبر ٢٠٢٣</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-sm text-on-surface-variant">إجمالي المبلغ</span>
            <span class="text-sm font-bold text-primary">١٢,٠٠٠ درهم</span>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <a href="bookings.html" class="flex-1 bg-primary text-on-primary px-4 py-3 rounded-xl text-center font-medium">حجوزاتي</a>
          <a href="index.html" class="flex-1 border border-primary text-primary px-4 py-3 rounded-xl text-center font-medium">الرئيسية</a>
        </div>
      </div>
    </main>
  </body>
</html>
