<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#f7faf5',
              surface: '#f7faf5',
              'surface-container-lowest': '#ffffff',
              'surface-container-low': '#f1f4ef',
              'surface-container': '#ecefea',
              'surface-container-high': '#e6e9e4',
              'surface-variant': '#e0e3de',
              'on-surface': '#191c1a',
              'on-surface-variant': '#3f4947',
              primary: '#00433f',
              'primary-container': '#0f5c57',
              'on-primary-container': '#8fd2cb',
              'on-primary': '#ffffff',
              secondary: '#7e5700',
              'secondary-container': '#ffc96f',
              outline: '#6f7977',
              'outline-variant': '#bec9c6',
              error: '#ba1a1a'
            },
            spacing: {
              'margin-page': '24px',
              'stack-sm': '8px',
              'stack-md': '16px',
              'stack-lg': '32px'
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen font-body flex flex-col md:hidden">
    <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
      <div class="flex flex-row-reverse items-center justify-between px-margin-page w-full h-16">
        <button class="active:scale-95 duration-150 hover:bg-surface-container-high transition-colors text-on-surface-variant p-2 rounded-full -mr-2">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="font-semibold text-xl text-primary absolute left-1/2 -translate-x-1/2 whitespace-nowrap">المساكن الخاصة</h1>
        <button class="active:scale-95 duration-150 hover:bg-surface-container-high transition-colors text-on-surface-variant p-2 rounded-full -ml-2">
          <span class="material-symbols-outlined">notifications</span>
        </button>
      </div>
    </header>

    <main class="flex-1 px-margin-page pt-[80px] pb-[100px] flex flex-col gap-stack-lg">
      <section class="flex flex-col items-center mt-2">
        <div class="w-24 h-24 rounded-full overflow-hidden mb-4 shadow-sm border border-surface-variant">
          <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="صورة المستخدم" />
        </div>
        <h2 class="text-3xl font-bold text-primary text-center">أحمد عبدالله</h2>
        <p class="text-sm text-on-surface-variant text-center mt-1">ahmed@example.com</p>
        <p class="text-sm text-outline mt-1">+966 50 123 4567</p>
      </section>

      <section class="flex flex-col gap-3">
        <div class="flex items-center justify-between bg-surface-container-lowest rounded-xl px-4 py-3 border border-outline-variant/30">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">person</span>
            <span class="font-medium">المعلومات الشخصية</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_left</span>
        </div>
        <div class="flex items-center justify-between bg-surface-container-lowest rounded-xl px-4 py-3 border border-outline-variant/30">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">favorite</span>
            <span class="font-medium">المفضلة</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_left</span>
        </div>
        <div class="flex items-center justify-between bg-surface-container-lowest rounded-xl px-4 py-3 border border-outline-variant/30">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">settings</span>
            <span class="font-medium">الإعدادات</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_left</span>
        </div>
        <div class="flex items-center justify-between bg-surface-container-lowest rounded-xl px-4 py-3 border border-outline-variant/30">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary">logout</span>
            <span class="font-medium">تسجيل الخروج</span>
          </div>
          <span class="material-symbols-outlined text-on-surface-variant">chevron_left</span>
        </div>
      </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full z-50 flex flex-row-reverse justify-around items-center px-4 py-3 pb-safe bg-surface/90 backdrop-blur-lg shadow-[0_-4px_12px_rgba(31,35,32,0.06)] rounded-t-xl md:hidden">
      <a href="index.html" class="flex flex-col items-center justify-center text-on-surface-variant">
        <span class="material-symbols-outlined mb-1">home</span>
        <span class="text-[11px]">الرئيسية</span>
      </a>
      <a href="bookings.html" class="flex flex-col items-center justify-center text-on-surface-variant">
        <span class="material-symbols-outlined mb-1">calendar_month</span>
        <span class="text-[11px]">حجوزاتي</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center justify-center text-primary font-bold">
        <span class="material-symbols-outlined mb-1">person</span>
        <span class="text-[11px]">الملف</span>
      </a>
    </nav>
  </body>
</html>
